name = "gargamelle"
version = "1.0.0"
licences = ["MIT"]
description = "Generate typed JSON decoders and JSON Schema 2020-12 documents from the same Gleam definition."
links = [{ title = "Repository", href = "https://github.com/vistuleB/gargamelle" }, { title = "Source archive", href = "https://repo.hex.pm/tarballs/gargamelle-1.0.0.tar" }]
target = "javascript"
gleam = ">= 1.18.1"

[dependencies]
gleam_stdlib = "== 1.0.5"
gleam_json = "== 3.1.0"

[dev-dependencies]
gleeunit = "== 1.11.0"

