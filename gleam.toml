name = "gargamelle"
version = "0.2.0"
licences = ["MIT"]
description = "Typed JSON decoding and JSON Schema 2020-12 generation from one Gleam definition"
repository = { type = "github", user = "vistuleB", repo = "gargamelle" }
internal_modules = ["schema_fixtures"]
target = "javascript"
gleam = ">= 1.18.1"

[dependencies]
gleam_stdlib = "== 1.0.5"
gleam_json = "== 3.1.0"

[dev-dependencies]
gleeunit = "== 1.11.0"

[[documentation.pages]]
title = "Technical contract"
path = "contract.html"
source = "./docs/contract.md"

[[documentation.pages]]
title = "Advanced definitions"
path = "advanced.html"
source = "./docs/advanced.md"

[[documentation.pages]]
title = "Verification and development"
path = "verification-guide.html"
source = "./docs/verification-guide.md"

[[documentation.pages]]
title = "MIT License"
path = "license.html"
source = "./docs/license.md"

[[documentation.pages]]
title = "Renderer sample"
path = "renderer-sample.html"
source = "./docs/renderer-sample.md"
