name = "gargamelle"
version = "0.2.1"
licences = ["MIT"]
description = "Typed JSON decoding and JSON Schema 2020-12 generation from one Gleam definition"
repository = { type = "custom", url = "https://repo.hex.pm/tarballs/gargamelle-0.2.1.tar" }
internal_modules = ["schema_fixtures"]
target = "javascript"
gleam = ">= 1.18.1"

[dependencies]
gleam_stdlib = "== 1.0.5"
gleam_json = "== 3.1.0"

[dev-dependencies]
gleeunit = "== 1.11.0"

